name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  # Exposed as a reusable workflow so the release pipeline runs these exact
  # checks before publishing, rather than a copy that can drift.
  workflow_call:

# A superseded run tells you nothing, so cancel it. Never cancel on main or on a
# tag, where the result is a record of what was shipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # The measured floor is 93%; the gap absorbs incidental churn without letting
  # coverage quietly erode.
  COVERAGE_FLOOR: "90"
  DEFAULT_PYTHON: "3.13"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        # Docstring rules are part of this, so undocumented public API fails here.
        run: ruff check . --output-format=github

      - name: Ruff format
        # --diff so a failure shows what to change instead of only naming files.
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Finish the whole matrix: knowing whether a failure is version-specific
      # is the point of having one.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Report the environment
        run: |
          python -VV
          pip --version
          ruff --version

      - name: Check for dependency conflicts
        run: pip check

      - name: Run tests
        run: |
          pytest -vv \
            --durations=10 \
            --cov=src/genai_opt \
            --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_FLOOR}"

      - name: Summarize coverage
        if: always()
        run: |
          {
            echo "### Coverage on Python ${{ matrix.python-version }}"
            echo
            coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        # Advisory for now: the generic engine still carries a few type: ignore
        # comments. Drop continue-on-error once it reports clean.
        continue-on-error: true
        run: mypy src/genai_opt

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the docs
        # --strict turns a broken reference or an unparseable docstring into a
        # failure. The API reference is generated from docstrings, so this also
        # checks that they parse.
        run: mkdocs build --strict

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: twine check --strict dist/*

      - name: Verify the built version matches the source
        run: |
          set -euo pipefail
          wheel_version=$(python -c "
          import pathlib, re
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          print(re.match(r'[^-]+-([^-]+)-', wheel.name).group(1))
          ")
          source_version=$(grep -oP '__version__ = \"\K[^\"]+' src/genai_opt/__init__.py)
          echo "wheel=${wheel_version} source=${source_version}"
          test "${wheel_version}" = "${source_version}"

      - name: Smoke test the wheel in a clean environment
        # An editable install hides packaging mistakes: a module left out of the
        # wheel still imports from the working tree. Installing the built
        # artifact into a fresh venv, outside the repository, is what catches it.
        # Example runners live in repo-only experiments/, so the smoke test
        # exercises the public engine API with a tiny inline genome instead.
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/pip check
          cat > /tmp/smoke_wheel.py <<'PY'
          import importlib.resources
          from typing import Self

          import genai_opt
          from genai_opt.optimizer_engine import (
              ExperimentBuilder,
              Population,
              ReproductionPolicy,
              TerminalController,
              generational_reproduction,
              iteration_limited_convergence,
              random_mutation,
              tournament_selection,
          )
          from genai_opt.optimizer_engine.genome import Genome
          from genai_opt.optimizer_engine.operation import Operation

          assert importlib.resources.files("genai_opt").joinpath("py.typed").is_file(), "py.typed missing from wheel"


          class SmokeGenome(Genome[float, float]):
              def __init__(self, phenotype: float, target: float = 50.0):
                  super().__init__(phenotype)
                  self.target = target

              async def invoke(self) -> Operation[float]:
                  return Operation(self.phenotype)

              async def evaluate(self) -> Operation[float]:
                  return Operation(100.0 - abs(self.invocation - self.target))

              async def mutate(self) -> Operation[Self]:
                  return Operation(SmokeGenome(self.phenotype + 1.0, target=self.target))

              async def crossover(self, other: Self) -> Operation[Self]:
                  mid = (self.phenotype + other.phenotype) / 2.0
                  return Operation(SmokeGenome(mid, target=self.target))


          builder = ExperimentBuilder(
              inital_population_strategy=lambda: Population(
                  [SmokeGenome(float(i) * 10.0) for i in range(4)]
              ),
              convergence_criterion=iteration_limited_convergence(2),
              mutation_policy=random_mutation(0.5),
              reproduction_policy=ReproductionPolicy(
                  generational_reproduction(4),
                  tournament_selection,
              ),
              experiment_controller=TerminalController(),
          )
          population = builder.build().run()
          _best, fitness = max(population.get_genome_fitness(), key=lambda item: item[1])
          assert population.get_genome_count() == 4
          assert fitness > 0
          print(f"genai-opt {genai_opt.__version__} ran a smoke experiment, best fitness {fitness:.2f}")
          PY
          # Strip the YAML indentation so the generated file is valid Python.
          sed -i 's/^          //' /tmp/smoke_wheel.py
          cd /tmp
          /tmp/smoke/bin/python /tmp/smoke_wheel.py

      - name: Upload the distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
