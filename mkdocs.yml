site_name: genai-opt / Docs
site_description: Documentation for the genai-opt Python optimization library.
repo_url: https://github.com/Wojciech151218/genai-opt

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/dna
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Welcome: index.md
  - Installation: installation.md
  - First Experiment: getting-started.md

exclude_docs: |
  /api-stability.md
  /api.md
  /checkpoints.md
  /development.md
  /llm-credentials-and-cost.md
  /phases.md
  /releasing.md
  /sqlite-checkpointer.md
  /web-dashboard.md
  /websocket-controller.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
