site_name: genai-opt / Docs
site_description: Documentation for the genai-opt Python optimization library.
repo_url: https://github.com/Wojciech151218/genai-opt

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Welcome: index.md
  - Installation: installation.md
  - Tutorials:
      - First Experiment: getting-started.md
      - Build Your Own Experiment: custom-experiment.md
      - Optimize a Prompt: haiku.md
  - Guides:
      - Iteration Phases: phases.md
      - Checkpoints and Resuming: checkpoints.md
      - SQLite Checkpointer: sqlite-checkpointer.md
      - WebSocket Controller: websocket-controller.md
      - Web Dashboard: web-dashboard.md
      - LLM Credentials and Cost: llm-credentials-and-cost.md
  - Reference:
      - API Reference: api.md
      - API Stability: api-stability.md
  - Contributing:
      - Development: development.md
      - Releasing: releasing.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
