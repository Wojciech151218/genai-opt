site_name: genai-opt
site_description: Documentation for the genai-opt Python optimization library.
repo_url: https://github.com/Wojciech151218/genai-opt

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Iteration Phases: phases.md
  - Checkpoints and Resuming: checkpoints.md
  - LLM Credentials and Cost: llm-credentials-and-cost.md
  - API Reference: api.md
  - API Stability: api-stability.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
