[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-opt"
dynamic = ["version"]
description = "A Python library for GenAI optimization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = []
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.20",
    "pytest-cov>=4.0",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.26",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "pre-commit",
]

[tool.setuptools.dynamic]
version = { attr = "genai_opt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genai_opt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables, etc.)
    "I",   # isort (import ordering)
    "N",   # pep8 naming conventions
    "B",   # bugbear (common logic mistakes)
    "C4",  # flake8-comprehensions (simplify list/dict expressions)
    "D",   # pydocstyle (public API must be documented in code)
    "UP",  # pyupgrade (outdated syntax)
    "RUF", # ruff-specific rules
]
ignore = [
    "N817",
    "UP046",
    "D105", # dunder methods are self-describing
    "D107", # google style documents constructor arguments on the class
]

[tool.mypy]
python_version = "3.11"
files = ["src/genai_opt"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
