[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-opt"
dynamic = ["version"]
description = "A Python library for GenAI optimization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Wojciech151218" },
    { name = "KrzysztofZaporowski" },
]
keywords = ["genai", "optimization", "evolutionary", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.15.20", "pytest-cov>=4.0", "mkdocs>=1.6", "pre-commit"]

[project.urls]
Homepage = "https://github.com/Wojciech151218/genai-opt"
Repository = "https://github.com/Wojciech151218/genai-opt"
Issues = "https://github.com/Wojciech151218/genai-opt/issues"
Changelog = "https://github.com/Wojciech151218/genai-opt/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "genai_opt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["genai_opt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables, etc.)
    "I",   # isort (import ordering)
    "N",   # pep8 naming conventions
    "B",   # bugbear (common logic mistakes)
    "C4",  # flake8-comprehensions (simplify list/dict expressions)
    "UP",  # pyupgrade (outdated syntax)
    "RUF", # ruff-specific rules
]
ignore = [
    "N817",
    "UP046",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
